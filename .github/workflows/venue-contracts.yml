name: Venue Contracts

on:
  push:
    paths:
      - 'service/contract_smoke.py'
      - 'service/venues.py'
      - 'service/features.py'
      - '.github/workflows/venue-contracts.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  public-api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r service/requirements.txt
      - name: Check current public venue schemas
        working-directory: service
        run: python contract_smoke.py
